server.port=8085
# Capacidade preparada para as rajadas de 300 consultas do RNF01.
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=50
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=30
spring.datasource.url=jdbc:h2:file:./runtime/af
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
af.orientacao.url=${AF_ORIENTACAO_URL:http://127.0.0.1:8012}
af.ml.url=${AF_ML_URL:http://127.0.0.1:8011}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:gamification}
spring.rabbitmq.password=${RABBITMQ_PASS:gamification}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=1000

af.admin-password=${AF_ADMIN_PASSWORD}
af.aluno1-password=${AF_ALUNO1_PASSWORD}
af.aluno2-password=${AF_ALUNO2_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
af.service-token=${AF_SERVICE_TOKEN:}
af.evaluation.url=${AF_EVALUATION_URL:http://127.0.0.1:8013}
