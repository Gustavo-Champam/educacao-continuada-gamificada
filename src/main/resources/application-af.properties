server.port=8085
spring.datasource.url=jdbc:h2:file:./runtime/af
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
af.orientacao.url=${AF_ORIENTACAO_URL:http://127.0.0.1:8012}
af.ml.url=${AF_ML_URL:http://127.0.0.1:8011}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:gamification}
spring.rabbitmq.password=${RABBITMQ_PASS:gamification}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=1000
