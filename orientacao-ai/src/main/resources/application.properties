spring.application.name=orientacao-ai
af.service-token=${AF_SERVICE_TOKEN}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://ollama-af:11434}
spring.ai.ollama.chat.options.model=${AF_CHAT_MODEL:qwen2.5:1.5b}
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.num-predict=400
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.model.embedding=none
spring.ai.retry.max-attempts=1
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=90s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.deserialization.fail-on-unknown-properties=true
