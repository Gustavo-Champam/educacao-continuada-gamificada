services:
  postgres-af:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: educacao_af
      POSTGRES_USER: educacao
      POSTGRES_PASSWORD: ${AF_DB_PASSWORD:-af_demo_database}
    volumes: ['postgres_af:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U educacao -d educacao_af']
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq-af:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: gamification
      RABBITMQ_DEFAULT_PASS: ${AF_RABBIT_PASSWORD:-af_demo_rabbit}
    volumes: ['rabbit_af:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20
  core-af:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: af,postgres
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres-af:5432/educacao_af
      DB_USER: educacao
      DB_PASSWORD: ${AF_DB_PASSWORD:-af_demo_database}
      AF_ADMIN_PASSWORD: ${AF_ADMIN_PASSWORD:-af-demo-champam-2026}
      AF_ALUNO1_PASSWORD: ${AF_ALUNO1_PASSWORD:-af-demo-aluno1-2026}
      AF_ALUNO2_PASSWORD: ${AF_ALUNO2_PASSWORD:-af-demo-aluno2-2026}
      AF_ML_URL: http://ml-af:8001
      AF_ORIENTACAO_URL: ${AF_ORIENTACAO_URL:-http://orientacao-af:8080}
      AF_EVALUATION_URL: ${AF_EVALUATION_URL:-http://evaluation-af:8013}
      AF_SERVICE_TOKEN: ${AF_SERVICE_TOKEN:-af-demo-internal-2026}
      RABBITMQ_HOST: rabbitmq-af
      RABBITMQ_USER: gamification
      RABBITMQ_PASS: ${AF_RABBIT_PASSWORD:-af_demo_rabbit}
    depends_on:
      postgres-af: {condition: service_healthy}
      rabbitmq-af: {condition: service_healthy}
  ml-af:
    build: ./ml
    environment:
      ML_AUTO_TRAIN: 'false'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    volumes: ['ml_af:/data']
    depends_on:
      ml-init: {condition: service_completed_successfully}
  ml-worker-af:
    build: {context: ./ml, dockerfile: Dockerfile.worker}
    environment:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RABBITMQ_HOST: rabbitmq-af
      RABBITMQ_USER: gamification
      RABBITMQ_PASS: ${AF_RABBIT_PASSWORD:-af_demo_rabbit}
    volumes: ['ml_af:/data']
    depends_on:
      ml-init: {condition: service_completed_successfully}
      rabbitmq-af: {condition: service_healthy}
  ml-init:
    build: ./ml
    environment:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    volumes: ['ml_af:/data']
    command: ['python', '-c', 'from training import MODEL, METADATA, train; train() if not (MODEL.exists() and METADATA.exists()) else None']
  gateway:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:8085:80']
    volumes: ['./docker/gateway-af.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [core-af]

  orientacao-af:
    build: ./orientacao-ai
    environment:
      AF_SERVICE_TOKEN: ${AF_SERVICE_TOKEN:-af-demo-internal-2026}
      OLLAMA_BASE_URL: http://ollama-af:11434
      AF_CHAT_MODEL: ${AF_CHAT_MODEL:-qwen2.5:1.5b}
  ollama-af:
    image: ollama/ollama:0.13.0
    volumes: ['ollama_af:/root/.ollama']
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 20
  ollama-init:
    image: ollama/ollama:0.13.0
    environment:
      OLLAMA_HOST: http://ollama-af:11434
      AF_CHAT_MODEL: ${AF_CHAT_MODEL:-qwen2.5:1.5b}
    entrypoint: ['/bin/sh', '-ec']
    command: ['ollama pull "$$AF_CHAT_MODEL"']
    depends_on:
      ollama-af: {condition: service_healthy}

volumes:
  ollama_af:
  postgres_af:
  rabbit_af:
  ml_af:
