services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: educacao
      POSTGRES_USER: educacao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educacao_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educacao -d educacao"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/educacao
      DB_USER: educacao
      DB_PASSWORD: ${POSTGRES_PASSWORD:-educacao_local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@educacao.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_local}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_dados:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dados:
  pgadmin_dados:
